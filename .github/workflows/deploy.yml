name: Build & Deploy to GitHub Pages

on:
  # Allow manual trigger from the GitHub Actions UI
  workflow_dispatch:

  # Also rebuild on every push to main
  push:
    branches:
      - main

permissions:
  contents: write   # needed by peaceiris/actions-gh-pages to push to gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch schedule & build
        # VITE_BASE must match the GitHub Pages sub-path.
        # If you publish to https://<user>.github.io/ddd-favorites/ set it to /ddd-favorites/
        # If you use a custom domain set it to /
        env:
          VITE_BASE: /ddd-favorites/
        run: bun run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          # Keep the gh-pages branch history lean
          force_orphan: true
          # Add a .nojekyll file so GitHub Pages serves files starting with _
          enable_jekyll: false
